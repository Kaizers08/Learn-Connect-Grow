services:
  scanner:
    build: .
    container_name: lcg-virus-scanner
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      PORT: 3030
      SCAN_API_KEY: ${SCAN_API_KEY}
      CLAMD_HOST: 127.0.0.1
      CLAMD_PORT: 3310
      MAX_SCAN_BYTES: ${MAX_SCAN_BYTES:-67108864}
      CLAMD_TIMEOUT_MS: ${CLAMD_TIMEOUT_MS:-120000}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
