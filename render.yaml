# Learning-materials virus scanner (ClamAV) - Render.com blueprint
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Everything below is created automatically.
#
# MEMORY: measured with a fully loaded signature database, clamd needs ~980MB
# RSS. Render's `free` and `starter` plans only give 512MB and the container is
# OOM-killed, so this blueprint uses `standard` (2GB).
#
# Cheaper alternative with plenty of headroom: Railway (about $5/mo, 8GB RAM).
# See docs/CLAMAV_SETUP.md, section "Deploy the scanner".

services:
  - type: web
    name: lcg-virus-scanner
    runtime: docker
    dockerfilePath: ./scanner/Dockerfile
    dockerContext: ./scanner
    plan: standard         # 2GB - required, 512MB plans get OOM-killed by clamd
    region: singapore      # closest to the Philippines - lower latency
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Render provides PORT automatically; the scanner honours it.
      - key: CLAMD_HOST
        value: 127.0.0.1
      - key: CLAMD_PORT
        value: "3310"
      - key: MAX_SCAN_BYTES
        value: "67108864"
      - key: CLAMD_TIMEOUT_MS
        value: "120000"
      # Set this in the Render dashboard (sync:false so it is never committed).
      # The SAME value must go into the Supabase function secret CLAMAV_SCAN_KEY.
      - key: SCAN_API_KEY
        sync: false
