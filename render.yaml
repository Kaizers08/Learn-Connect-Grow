# Learning-materials virus scanner (ClamAV) — Render.com blueprint
# https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then Render Dashboard → New → Blueprint →
# pick this repo. Everything below is created automatically.

services:
  - type: web
    name: lcg-virus-scanner
    runtime: docker
    dockerfilePath: ./scanner/Dockerfile
    dockerContext: ./scanner
    # Free spins the service down after ~15 min idle, so the first scan after a
    # quiet period can take ~60s. Use `starter` (~$7/mo) if you want it always
    # warm - the Edge Function timeout (120s) already tolerates the free tier.
    plan: free
    region: singapore      # pinakamalapit sa PH — mas mababa ang latency
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Render provides PORT automatically; the scanner honours it.
      - key: CLAMD_HOST
        value: 127.0.0.1
      - key: CLAMD_PORT
        value: "3310"
      - key: MAX_SCAN_BYTES
        value: "67108864"
      - key: CLAMD_TIMEOUT_MS
        value: "120000"
      # Set this in the Render dashboard (sync:false so it is never committed).
      # The SAME value must go into the Supabase function secret CLAMAV_SCAN_KEY.
      - key: SCAN_API_KEY
        sync: false
